[project]
name = "meeting-rooms"
version = "0.1.0"
description = "MCP server for booking meeting rooms on Google Calendar, with an identity-aware tool gateway"
readme = "README.md"
authors = [{ name = "Vincent Carrere" }]
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.2.5",
    "pydantic-ai-slim[anthropic,mcp]>=2.73.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
meeting-rooms = "meeting_rooms:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
